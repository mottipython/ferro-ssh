name: CI & Build Releases

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-linux:
    name: Build Linux (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libssl-dev \
            pkg-config
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run test suite (unit + fuzz integration)
        run: cargo test --verbose
      - name: Build release binary
        run: cargo build --release --verbose
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferro-ssh-linux-x86_64
          path: target/release/ferro-ssh

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run test suite
        run: cargo test --verbose
      - name: Build release binary
        run: cargo build --release --verbose
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferro-ssh-windows-x86_64
          path: target/release/ferro-ssh.exe

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: ferro-ssh-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: ferro-ssh-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Run test suite
        run: cargo test --verbose
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ferro-ssh
