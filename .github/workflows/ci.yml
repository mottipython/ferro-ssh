name: CI & Build Releases

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-linux:
    name: Build Linux (Fedora/Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release --verbose
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferro-ssh-linux-x86_64
          path: target/release/ferro-ssh

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Release
        run: cargo build --release --verbose
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferro-ssh-windows-x86_64
          path: target/release/ferro-ssh.exe
