[package]
name = "ferro-ssh"
version = "0.1.0"
edition = "2021"
authors = ["FerroSSH Team"]
description = "A secure, feature-rich GUI SSH client with PTY terminal, SFTP, and host key protection"
license = "MIT"

[lib]
name = "ferro_ssh"
path = "src/lib.rs"

[[bin]]
name = "ferro-ssh"
path = "src/main.rs"

[[bin]]
name = "fuzz-runner"
path = "src/bin/fuzz_runner.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
portable-pty = "0.8"
vte = "0.13"
zeroize = { version = "1.8", features = ["derive"] }
rfd = "0.15"
directories = "5.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
base64 = "0.22"

# Linux-only: Wayland and X11 windowing backends
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
